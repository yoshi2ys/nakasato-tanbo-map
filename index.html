<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>田んぼ輪郭描画ツール</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <div id="mode" role="radiogroup" aria-label="入力方法">
        <label><input type="radio" name="mode" value="manual" checked disabled />手動</label>
        <label><input type="radio" name="mode" value="auto" disabled />自動検出</label>
      </div>
      <p id="hint">読み込み中…</p>
      <dl id="area" hidden>
        <dt>㎡</dt>
        <dd id="area-square-meters"></dd>
        <dt>反</dt>
        <dd id="area-tan"></dd>
        <dt>畝</dt>
        <dd id="area-se"></dd>
      </dl>
      <button id="reset" type="button" disabled>新しく描く</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
