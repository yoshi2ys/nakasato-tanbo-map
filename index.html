<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>田んぼ輪郭描画ツール</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <div id="mode" role="radiogroup" aria-label="入力方法">
        <label><input type="radio" name="mode" value="manual" checked disabled />手動</label>
        <label><input type="radio" name="mode" value="auto" disabled />自動検出</label>
        <label><input type="radio" name="mode" value="measure" disabled />メジャー</label>
      </div>
      <p id="hint">読み込み中…</p>
      <dl id="area" hidden>
        <dt>㎡</dt>
        <dd id="area-square-meters"></dd>
        <dt>反</dt>
        <dd id="area-tan"></dd>
        <dt>畝</dt>
        <dd id="area-se"></dd>
      </dl>
      <dl id="measure" hidden>
        <dt>合計</dt>
        <dd id="measure-total"></dd>
      </dl>
      <button id="reset" type="button" disabled>新しく描く</button>

      <section id="library">
        <h2 id="library-heading">保存した田んぼ</h2>
        <ul id="paddies"></ul>
        <p id="library-empty">まだありません。輪郭を閉じると保存されます。</p>
        <div id="library-actions">
          <button id="export" type="button" disabled>書き出す</button>
          <button id="import" type="button" disabled>読み込む</button>
          <input id="import-file" type="file" accept=".geojson,.json,application/geo+json,application/json" hidden />
        </div>
      </section>

      <section id="offline">
        <h2 id="offline-heading">オフライン用の地図</h2>
        <p id="offline-status">確認中…</p>
        <div id="offline-actions">
          <button id="offline-save" type="button" disabled>この範囲を保存</button>
          <button id="offline-clear" type="button" disabled>消す</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
